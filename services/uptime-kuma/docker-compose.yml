services:
  uptime-kuma:
    image: louislam/uptime-kuma:2   # v2 (migrate DB จาก v1 ครั้งเดียว ย้อนไม่ได้ — backup ก่อนขึ้น major) · :latest ยังชี้ v1
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${BASE_DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

volumes:
  # pin ชื่อ volume ให้คงที่ — ไม่ผูกกับชื่อ project
  uptime_kuma_data:
    name: uptime_kuma_data

networks:
  proxy:
    external: true
