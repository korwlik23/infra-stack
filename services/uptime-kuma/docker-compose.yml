services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim   # v2 ไม่มี Chromium (CVE ~410 รายการ) — ต้องใช้ monitor แบบ Real Browser ค่อยเปลี่ยนเป็น :2 · ขึ้น major backup ก่อน (migrate DB ย้อนไม่ได้)
    container_name: uptime-kuma
    restart: unless-stopped
    # log ไม่เกิน 30MB ต่อ container (ค่า default ของ Docker ไม่มีเพดาน — โตจน disk เต็มได้)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.${BASE_DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

volumes:
  # pin ชื่อ volume ให้คงที่ — ไม่ผูกกับชื่อ project
  uptime_kuma_data:
    name: uptime_kuma_data

networks:
  proxy:
    external: true
