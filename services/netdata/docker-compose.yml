services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`netdata.${BASE_DOMAIN}`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls.certresolver=letsencrypt"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"
      # basicauth กลาง — install.sh สร้างจาก DASHBOARD_USER/DASHBOARD_PASSWORD ใน .env
      - "traefik.http.routers.netdata.middlewares=dashboard-auth@file"

volumes:
  # pin ชื่อ volume ให้คงที่ — ไม่ผูกกับชื่อ project
  netdata_config:
    name: netdata_config
  netdata_lib:
    name: netdata_lib
  netdata_cache:
    name: netdata_cache

networks:
  proxy:
    external: true
