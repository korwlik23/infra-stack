services:
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # แยก user/pass ออกจาก URI — กันรหัสผ่านที่มี @ : / # ? ทำ DSN พัง
      # (DATA_SOURCE_NAME แบบ URL เดียวจะ parse ผิดทันทีถ้ารหัสมีอักขระพิเศษ)
      - DATA_SOURCE_URI=postgres:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=${POSTGRES_USER}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD}
    networks:
      - backend
      - monitoring

networks:
  backend:
    external: true
    name: backend
  monitoring:
    external: true
    name: monitoring
