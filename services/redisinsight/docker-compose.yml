services:
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - redisinsight_data:/data
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redisinsight.rule=Host(`redis.${BASE_DOMAIN}`)"
      - "traefik.http.routers.redisinsight.entrypoints=websecure"
      - "traefik.http.routers.redisinsight.tls.certresolver=letsencrypt"
      - "traefik.http.services.redisinsight.loadbalancer.server.port=5540"
      # RedisInsight ไม่มี login ของตัวเอง — บังคับ basicauth กลางที่ Traefik
      # (install.sh สร้างจาก DASHBOARD_USER/DASHBOARD_PASSWORD ใน .env)
      - "traefik.http.routers.redisinsight.middlewares=dashboard-auth@file"

volumes:
  # pin ชื่อ volume ให้คงที่ — ไม่ผูกกับชื่อ project
  redisinsight_data:
    name: redisinsight_data

networks:
  proxy:
    external: true
  backend:
    external: true
    name: backend
