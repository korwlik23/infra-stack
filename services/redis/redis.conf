# Redis production config — cache / queue / session
# password ถูกส่งผ่าน --requirepass ใน compose (จาก .env)

# Persistence: AOF ปลอดภัยกว่า RDB สำหรับ queue
appendonly yes
appendfsync everysec

# Memory: กันไม่ให้ Redis กิน RAM ทั้งเครื่อง (ปรับตามสเปก VPS)
maxmemory 512mb
# volatile-lru = ไล่ทิ้งเฉพาะ key ที่มี TTL (cache) — job ใน queue ไม่มี TTL จึงไม่ถูกลบ
# (allkeys-lru เดิมลบ job ใน queue เงียบ ๆ ได้ตอน RAM เต็ม) ถ้าไม่เหลือ key ที่มี TTL
# Redis จะตอบ OOM ตอนเขียน → เห็น error แทนข้อมูลหายเงียบ ๆ
maxmemory-policy volatile-lru

# Network — container network เท่านั้น ห้าม expose ออก internet
bind 0.0.0.0
protected-mode yes

# ปิดคำสั่งอันตรายใน production
# หมายเหตุ: ไม่ปิด FLUSHDB — Laravel `cache:clear` / `optimize:clear` ต้องใช้
# (เจอจริง: "ERR unknown command 'FLUSHDB'") — FLUSHDB ลบแค่ DB เดียวรับความเสี่ยงได้
rename-command FLUSHALL ""
rename-command CONFIG ""
