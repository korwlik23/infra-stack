services:
  traefik:
    # pin แค่ major version — v3.1 เจอปัญหา Docker API เก่าเกินกับ Docker 29+
    # ("client version 1.24 is too old" → Traefik มองไม่เห็น container → 404 ทุกโดเมน)
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # ปิด MPTCP ใน network namespace ของ Traefik — Go ≥ 1.24 เปิด MPTCP ให้ listener เอง และ listener MPTCP
    # คือทางที่ exploit CVE-2026-98432 (TCP use-after-free, CVSS 9.8) ใช้ได้ root · client MPTCP ต่อเป็น TCP ปกติแทน
    # ⚠️ ลดความเสี่ยงเท่านั้น บั๊กอยู่ใน TCP — ต้องอัปเดต kernel ที่แก้แล้ว + reboot (docs/02-security.md)
    sysctls:
      - net.mptcp.enabled=0
    # Static config ผ่าน CLI แทน traefik.yml — ACME email มาจาก .env ที่เดียว
    # (เดิม install.sh sed แก้ traefik.yml ที่อยู่ใน Git → git status ไม่ clean + pull ชน)
    # ⚠️ ห้าม mount ไฟล์ /etc/traefik/traefik.yml กลับเข้ามา — ถ้ามีไฟล์ Traefik จะใช้ไฟล์และข้าม flag ทั้งหมด
    command:
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Cloudflare Proxy (เมฆส้ม): เชื่อ X-Forwarded-For เฉพาะจาก IP ของ Cloudflare → app เห็น IP จริงของผู้ใช้
      # (ไม่งั้น Traefik เขียนทับเป็น IP ของ Cloudflare edge → rate limit ต่อ IP รวมผู้ใช้หลายคนเป็นคนเดียว)
      # ที่มา https://www.cloudflare.com/ips-v4 + ips-v6 (ดึง 2026-11-07) — Cloudflare เปลี่ยนรายการ → อัปเดตตรงนี้
      # คนที่ต่อตรงเข้า IP เครื่อง (ไม่ผ่าน Cloudflare) ยังปลอม header ไม่ได้ เพราะไม่อยู่ในรายการนี้
      - "--entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./acme.json:/acme.json
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Dashboard — protected, only via HTTPS subdomain
      - "traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      # basicauth กลาง — install.sh สร้างจาก DASHBOARD_USER/DASHBOARD_PASSWORD ใน .env
      # (dynamic/auth.yml อยู่นอก Git — ไม่ต้องแก้ hash ในไฟล์นี้)
      - "traefik.http.routers.traefik.middlewares=dashboard-auth@file"

networks:
  proxy:
    external: true
